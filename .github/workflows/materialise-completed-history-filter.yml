name: Materialise completed history filter

on:
  push:
    branches:
      - fix/exclude-unfinished-history
    paths:
      - ".github/workflows/materialise-completed-history-filter.yml"

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/exclude-unfinished-history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Apply completed-history patch
        run: python tools/materialise_completed_history_filter.py
      - name: Verify source
        run: |
          git diff --check -- src tests
          python -m unittest discover -s tests -v
      - name: Commit materialised source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/build_fpl_model.py tests/test_build_fpl_model.py
          git commit -m "Exclude unfinished fixtures from live history features"
          git push origin HEAD:fix/exclude-unfinished-history
