name: Validate Wildcard beam budget feasibility

on:
  push:
    branches:
      - fix/wildcard-beam-budget-feasibility
    paths:
      - ".github/workflows/validate-wildcard-beam-budget.yml"

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/wildcard-beam-budget-feasibility

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --requirement requirements.txt

      - name: Apply budget-feasible beam patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/fpl_chip_optimizer.py",
              'WILDCARD_OBJECTIVE_VERSION = "captaincy-ceiling-1.1"',
              'WILDCARD_OBJECTIVE_VERSION = "captaincy-ceiling-1.2"',
          )

          replace_once(
              "src/fpl_chip_optimizer.py",
              '''    for position in slots:\n        expanded = []''',
              '''    for slot_index, position in enumerate(slots):\n        remaining_slots = slots[slot_index + 1 :]\n        expanded = []''',
          )

          replace_once(
              "src/fpl_chip_optimizer.py",
              '''                new_cost = cost + number(player_by_id[player_id].get("price"))\n                if new_cost > budget + 1e-9:\n                    continue\n                new_clubs = dict(clubs)''',
              '''                new_cost = cost + number(player_by_id[player_id].get("price"))\n                if new_cost > budget + 1e-9:\n                    continue\n\n                # Reserve enough budget to complete every remaining positional slot.\n                # This is deliberately a lower bound: it ignores club limits, so it can\n                # keep an infeasible state but can never prune a genuinely feasible one.\n                new_selected = selected + (player_id,)\n                remaining_counts: dict[str, int] = {}\n                for remaining_position in remaining_slots:\n                    remaining_counts[remaining_position] = (\n                        remaining_counts.get(remaining_position, 0) + 1\n                    )\n                minimum_remaining_cost = 0.0\n                completion_possible = True\n                selected_set = set(new_selected)\n                for remaining_position, required_count in remaining_counts.items():\n                    available_prices = sorted(\n                        number(player_by_id[candidate_id].get("price"))\n                        for candidate_id in candidates[remaining_position]\n                        if candidate_id not in selected_set\n                    )\n                    if len(available_prices) < required_count:\n                        completion_possible = False\n                        break\n                    minimum_remaining_cost += sum(available_prices[:required_count])\n                if (\n                    not completion_possible\n                    or new_cost + minimum_remaining_cost > budget + 1e-9\n                ):\n                    continue\n\n                new_clubs = dict(clubs)''',
          )

          replace_once(
              "src/fpl_chip_optimizer.py",
              '''                        selected + (player_id,),\n                        new_cost,''',
              '''                        new_selected,\n                        new_cost,''',
          )

          # Test helper can express cheap and premium alternatives.
          replace_once(
              "tests/test_wildcard_strategy.py",
              '''    ownership: float = 0.0,\n    team_id: int | None = None,\n) -> dict:''',
              '''    ownership: float = 0.0,\n    team_id: int | None = None,\n    price: float = 5.0,\n) -> dict:''',
          )
          replace_once(
              "tests/test_wildcard_strategy.py",
              '''        "price": 5.0,''',
              '''        "price": price,''',
          )
          replace_once(
              "tests/test_wildcard_strategy.py",
              '''    _strategic_gameweek_score,\n    _wildcard_search_heuristic,\n)''',
              '''    _strategic_gameweek_score,\n    _wildcard_search_heuristic,\n    optimise_budget_squad,\n)''',
          )

          target = Path("tests/test_wildcard_strategy.py")
          text = target.read_text(encoding="utf-8")
          anchor = '''    def test_objective_version_records_beam_search_fix(self) -> None:\n'''
          regression = '''    def test_beam_reserves_budget_for_a_legal_completion(self) -> None:\n        players = {}\n        points = {}\n        player_id = 1\n        for position, required in (("Goalkeeper", 2), ("Defender", 5), ("Midfielder", 5), ("Forward", 3)):\n            # Enough expensive, high-heuristic choices to strand the old beam, plus\n            # cheap alternatives that make a legal squad possible under the budget.\n            for _ in range(required):\n                players[player_id] = player(\n                    player_id, position, team_id=player_id, price=10.0\n                )\n                points[player_id] = 10.0\n                player_id += 1\n            for _ in range(required):\n                players[player_id] = player(\n                    player_id, position, team_id=player_id, price=4.0\n                )\n                points[player_id] = 1.0\n                player_id += 1\n\n        result = optimise_budget_squad(\n            players, points, budget=100.0, beam_width=1\n        )\n\n        self.assertIsNotNone(result)\n        squad_ids, cost, _, _, _ = result\n        self.assertEqual(len(squad_ids), 15)\n        self.assertLessEqual(cost, 100.0)\n\n'''
          if anchor not in text:
              raise SystemExit("Wildcard test anchor missing")
          text = text.replace(anchor, regression + anchor, 1)
          text = text.replace(
              'self.assertEqual(WILDCARD_OBJECTIVE_VERSION, "captaincy-ceiling-1.1")',
              'self.assertEqual(WILDCARD_OBJECTIVE_VERSION, "captaincy-ceiling-1.2")',
              1,
          )
          target.write_text(text, encoding="utf-8")
          PY

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Build live shadow model
        run: python -m src.build_fpl_model --data-dir data

      - name: Print GW3 Wildcard shadow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path("data/chatgpt/fpl_decisions.json").read_text(encoding="utf-8"))
          opt = decision.get("chip_optimisation", {})
          wc3 = [
              row for row in opt.get("candidates", [])
              if row.get("chip") == "wildcard" and int(row.get("gameweek") or 0) == 3
          ]
          best = max(wc3, key=lambda row: row.get("strategic_objective_score", 0), default={})
          print("GW3_WILDCARD", json.dumps({
              "status": best.get("status"),
              "mean_edge": best.get("incremental_expected_points"),
              "strategic_edge": best.get("strategic_objective_edge"),
              "strategic_score": best.get("strategic_objective_score"),
              "captain_player_id": best.get("captain_player_id"),
              "contains_haaland": 411 in (best.get("replacement_squad_player_ids") or []),
              "replacement_squad_player_ids": best.get("replacement_squad_player_ids"),
          }, indent=2))
          PY

      - name: Commit validated source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fpl_chip_optimizer.py tests/test_wildcard_strategy.py
          git diff --cached --check
          git commit -m "Keep Wildcard beam budget-feasible"
          git push origin fix/wildcard-beam-budget-feasibility
