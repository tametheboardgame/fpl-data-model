name: Apply Wildcard context wiring

on:
  push:
    branches:
      - fix/wildcard-context-wiring

permissions:
  contents: write

concurrency:
  group: apply-wildcard-context-wiring
  cancel-in-progress: true

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/wildcard-context-wiring
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Apply deterministic source patch
        run: python scripts/apply_wildcard_context_wiring.py
      - name: Compile changed modules
        run: python -m py_compile src/fpl_decisions.py src/fpl_chip_optimizer.py tests/test_chip_context_wiring.py
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_wildcard_context_wiring.py .github/workflows/apply-wildcard-context-wiring.yml
          git add src/fpl_decisions.py src/fpl_chip_optimizer.py tests/test_chip_context_wiring.py
          git commit -m "Wire decision context into chip optimisation"
          git push origin HEAD:fix/wildcard-context-wiring
