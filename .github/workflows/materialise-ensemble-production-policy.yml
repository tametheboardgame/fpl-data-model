name: Materialise ensemble production policy

on:
  push:
    branches:
      - fix/sticky-ensemble-production-policy
    paths:
      - ".github/workflows/materialise-ensemble-production-policy.yml"

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/sticky-ensemble-production-policy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Apply production policy guard
        run: python tools/materialise_ensemble_production_policy.py
      - name: Verify source
        run: |
          git diff --check -- src tests data/model/ensemble_production_policy.json
          python -m unittest discover -s tests -v
      - name: Commit materialised source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/build_fpl_model.py tests/test_holdout_rejection_fallback.py
          git commit -m "Make ensemble production rejection sticky"
          git push origin HEAD:fix/sticky-ensemble-production-policy
