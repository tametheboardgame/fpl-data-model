name: Validate component early-season usage prior v2

on:
  push:
    branches:
      - fix/component-early-season-minutes-prior
    paths:
      - ".github/workflows/validate-component-early-season-prior-v2.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/component-early-season-minutes-prior

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --requirement requirements.txt

      - name: Apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:180]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/component_player_simulator.py",
              'COMPONENT_MODEL_VERSION = "player-sim-3.0-candidate"',
              'COMPONENT_MODEL_VERSION = "player-sim-3.1-candidate"',
          )
          replace_once(
              "src/component_player_simulator.py",
              '''    fixtures_6 = number(feature.get("fixtures_6"))\n    start_rate_6 = number(feature.get("start_rate_6"))\n    appearance_rate_6 = number(feature.get("appearance_rate_6"))\n    if not fixtures_6:''',
              '''    fixtures_6 = number(feature.get("fixtures_6"))\n    start_rate_6 = number(feature.get("start_rate_6"))\n    appearance_rate_6 = number(feature.get("appearance_rate_6"))\n    player_start_rate_prior = (\n        number(base_inputs.get("player_start_rate_prior"))\n        if "player_start_rate_prior" in base_inputs\n        else number(prior.get("start_rate"))\n    )\n    player_appearance_rate_prior = (\n        number(base_inputs.get("player_appearance_rate_prior"))\n        if "player_appearance_rate_prior" in base_inputs\n        else number(prior.get("appearance_rate"))\n    )\n    if not fixtures_6:''',
          )
          replace_once(
              "src/component_player_simulator.py",
              '''        smoothed_start = beta_smoothed_rate(\n            start_rate_6,\n            fixtures_6,\n            number(prior.get("start_rate")),\n        )\n        smoothed_appearance = beta_smoothed_rate(\n            max(start_rate_6, appearance_rate_6),\n            fixtures_6,\n            max(\n                number(prior.get("start_rate")),\n                number(prior.get("appearance_rate")),\n            ),\n        )''',
              '''        smoothed_start = beta_smoothed_rate(\n            start_rate_6,\n            fixtures_6,\n            player_start_rate_prior,\n        )\n        smoothed_appearance = beta_smoothed_rate(\n            max(start_rate_6, appearance_rate_6),\n            fixtures_6,\n            max(player_start_rate_prior, player_appearance_rate_prior),\n        )''',
          )

          replace_once(
              "src/build_fpl_model.py",
              '''        selection = candidate.get("assessment", {}).get("selection", {})\n        point_weight = max(0.0, min(1.0, number(selection.get("selected_point_weight"))))''',
              '''        assessment = candidate.get("assessment", {})\n        if assessment.get("component_model_version") != COMPONENT_MODEL_VERSION:\n            return {\n                **disabled,\n                "status": "candidate_component_version_mismatch",\n            }\n        selection = assessment.get("selection", {})\n        point_weight = max(0.0, min(1.0, number(selection.get("selected_point_weight"))))''',
          )
          replace_once(
              "src/build_fpl_model.py",
              '''        "previous_season": (past or {}).get("season_name"),\n        "previous_season_minutes": past_minutes,\n        "availability_probability": availability,''',
              '''        "previous_season": (past or {}).get("season_name"),\n        "previous_season_minutes": past_minutes,\n        "player_start_rate_prior": max(0, min(1, past_start_rate)),\n        "player_appearance_rate_prior": max(\n            0, min(1, max(past_start_rate, past_appearance_rate))\n        ),\n        "availability_probability": availability,''',
          )
          replace_once(
              "src/build_fpl_model.py",
              '''    "component_expected_points",\n    "component_expected_minutes",''',
              '''    "component_expected_points",\n    "component_start_rate_prior",\n    "component_appearance_rate_prior",\n    "component_expected_minutes",''',
          )
          replace_once(
              "src/build_fpl_model.py",
              '''                "component_expected_points": round(component_adjusted["expected_points"], 4),\n                "component_expected_minutes": round(''',
              '''                "component_expected_points": round(component_adjusted["expected_points"], 4),\n                "component_start_rate_prior": round(\n                    number(component_base_inputs.get("player_start_rate_prior")), 4\n                ),\n                "component_appearance_rate_prior": round(\n                    number(component_base_inputs.get("player_appearance_rate_prior")), 4\n                ),\n                "component_expected_minutes": round(''',
          )

          replace_once(
              "src/backtest_fpl_model.py",
              '''def player_key(row: dict[str, Any]) -> str:\n    element = str(row.get("element") or "").strip()\n    return element if element else str(row.get("player_name") or "").strip().lower()\n\n\ndef position_code''',
              '''def player_key(row: dict[str, Any]) -> str:\n    element = str(row.get("element") or "").strip()\n    return element if element else str(row.get("player_name") or "").strip().lower()\n\n\ndef cross_season_player_key(row: dict[str, Any]) -> str:\n    return str(row.get("player_name") or "").strip().casefold()\n\n\ndef previous_season_name(season: str) -> str:\n    parts = str(season).split("-")\n    if len(parts) != 2:\n        return ""\n    try:\n        start = int(parts[0])\n        end = int(parts[1])\n    except ValueError:\n        return ""\n    return f"{start - 1}-{(end - 1) % 100:02d}"\n\n\ndef previous_season_usage(rows: list[dict[str, Any]]) -> dict[str, dict[str, float]]:\n    grouped: dict[str, list[dict[str, Any]]] = defaultdict(list)\n    for row in rows:\n        key = cross_season_player_key(row)\n        if key:\n            grouped[key].append(row)\n    output: dict[str, dict[str, float]] = {}\n    for key, player_rows in grouped.items():\n        minutes = sum(number(row.get("minutes")) for row in player_rows)\n        starts = sum(\n            number(row.get("starts")) > 0 or number(row.get("minutes")) >= 60\n            for row in player_rows\n        )\n        start_rate = clamp(starts / 38, 0, 1)\n        appearance_rate = clamp(max(start_rate, minutes / (38 * 60)), 0, 1)\n        output[key] = {\n            "player_start_rate_prior": start_rate,\n            "player_appearance_rate_prior": appearance_rate,\n            "previous_season_minutes": minutes,\n        }\n    return output\n\n\ndef position_code''',
          )
          replace_once(
              "src/backtest_fpl_model.py",
              '''    team_histories: dict[str, list[dict[str, Any]]],\n    opponent: str,\n    *,\n    simulations: int,''',
              '''    team_histories: dict[str, list[dict[str, Any]]],\n    opponent: str,\n    usage_prior: dict[str, Any] | None = None,\n    *,\n    simulations: int,''',
          )
          replace_once(
              "src/backtest_fpl_model.py",
              '''    # Defensive-contribution points did not exist in the seasons under test.\n    inputs["defensive_contribution_per_90"] = 0\n    seed =''',
              '''    if usage_prior:\n        inputs["player_start_rate_prior"] = clamp(\n            number(usage_prior.get("player_start_rate_prior")), 0, 1\n        )\n        inputs["player_appearance_rate_prior"] = clamp(\n            max(\n                number(usage_prior.get("player_start_rate_prior")),\n                number(usage_prior.get("player_appearance_rate_prior")),\n            ),\n            0,\n            1,\n        )\n    # Defensive-contribution points did not exist in the seasons under test.\n    inputs["defensive_contribution_per_90"] = 0\n    seed =''',
          )
          replace_once(
              "src/backtest_fpl_model.py",
              '''def walk_forward_season(\n    season_rows: list[dict[str, Any]], *, simulations: int = BACKTEST_SIMULATIONS\n) -> list[dict[str, Any]]:\n    by_gameweek:''',
              '''def walk_forward_season(\n    season_rows: list[dict[str, Any]],\n    previous_season_rows: list[dict[str, Any]] | None = None,\n    *,\n    simulations: int = BACKTEST_SIMULATIONS,\n) -> list[dict[str, Any]]:\n    usage_priors = previous_season_usage(previous_season_rows or [])\n    by_gameweek:''',
          )
          replace_once(
              "src/backtest_fpl_model.py",
              '''                        team_histories,\n                        opponent,\n                        simulations=simulations,''',
              '''                        team_histories,\n                        opponent,\n                        usage_priors.get(cross_season_player_key(sample)),\n                        simulations=simulations,''',
          )
          replace_once(
              "src/backtest_fpl_model.py",
              '''    seasons = seasons or DEFAULT_SEASONS\n    historical_path = data_dir / "history" / "historical_player_gameweeks.csv.gz"\n    rows = read_historical(historical_path, seasons)\n    by_season: dict[str, list[dict[str, Any]]] = defaultdict(list)''',
              '''    seasons = seasons or DEFAULT_SEASONS\n    historical_path = data_dir / "history" / "historical_player_gameweeks.csv.gz"\n    prior_context_seasons = sorted(\n        {\n            previous\n            for season in seasons\n            if (previous := previous_season_name(season))\n        }\n    )\n    source_seasons = sorted(set(seasons).union(prior_context_seasons))\n    rows = read_historical(historical_path, source_seasons)\n    by_season: dict[str, list[dict[str, Any]]] = defaultdict(list)''',
          )
          replace_once(
              "src/backtest_fpl_model.py",
              '''        predictions.extend(\n            walk_forward_season(by_season.get(season, []), simulations=simulations)\n        )''',
              '''        predictions.extend(\n            walk_forward_season(\n                by_season.get(season, []),\n                by_season.get(previous_season_name(season), []),\n                simulations=simulations,\n            )\n        )''',
          )
          replace_once(
              "src/backtest_fpl_model.py",
              '''        "held_out_season": HELD_OUT_SEASON,\n        "historical_source_rows": len(rows),''',
              '''        "held_out_season": HELD_OUT_SEASON,\n        "prior_context_seasons": prior_context_seasons,\n        "historical_source_rows": len(rows),''',
          )
          replace_once(
              "src/backtest_fpl_model.py",
              '''            "Players are evaluated only after three prior fixture rows, excluding early-season and immediate new-signing decisions.",''',
              '''            "Players are evaluated only after three prior fixture rows; previous-season usage is supplied without target-season lookahead when available.",''',
          )
          PY

      - name: Check patch
        run: git diff --check

      - name: Run unit suite
        run: python -m unittest discover -s tests -v

      - name: Run leakage-safe backtest
        run: python -m src.backtest_fpl_model --data-dir data

      - name: Validate candidate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.component_player_simulator import COMPONENT_MODEL_VERSION

          ensemble = json.loads(Path("data/model/ensemble_model_candidate.json").read_text())
          component = json.loads(Path("data/model/component_model_candidate.json").read_text())
          assessment = ensemble.get("assessment", {})
          if assessment.get("component_model_version") != COMPONENT_MODEL_VERSION:
              raise SystemExit("Backtest evidence did not bind to current component version")
          print(json.dumps({
              "component_model_version": COMPONENT_MODEL_VERSION,
              "ensemble_status": ensemble.get("status"),
              "selected_point_weight": assessment.get("selection", {}).get("selected_point_weight"),
              "selected_probability_weights": assessment.get("selection", {}).get("selected_probability_weights"),
              "hybrid_promotion": assessment.get("recommended_for_live_promotion"),
              "hybrid_metrics": assessment.get("held_out_hybrid_metrics"),
              "control_metrics": assessment.get("held_out_control_metrics"),
              "component_status": component.get("status"),
          }, indent=2))
          PY

      - name: Build live shadow with newly fitted candidate
        run: python -m src.build_fpl_model --data-dir data

      - name: Report live projection effect
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          rows = list(csv.DictReader(Path("data/chatgpt/player_projections.csv").open()))
          haaland = [row for row in rows if row.get("web_name") == "Haaland"]
          first = haaland[0] if haaland else {}
          summary = json.loads(Path("data/chatgpt/projection_summary.json").read_text())
          print(json.dumps({
              "ensemble_status": summary.get("ensemble_status"),
              "challenger_model_version": summary.get("challenger_model_version"),
              "first_haaland_gameweek": first.get("gameweek"),
              "haaland_expected_minutes": first.get("expected_minutes"),
              "haaland_component_expected_minutes": first.get("component_expected_minutes"),
              "haaland_control_xpts": first.get("control_expected_points"),
              "haaland_component_xpts": first.get("component_expected_points"),
              "haaland_ensemble_xpts": first.get("expected_points"),
              "haaland_component_start_prior": first.get("component_start_rate_prior"),
          }, indent=2))
          PY

      - name: Commit validated source, tests and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/component_player_simulator.py src/build_fpl_model.py src/backtest_fpl_model.py tests/test_component_early_season_prior.py data/backtests data/model
          git diff --cached --check
          git commit -m "Use player-specific early-season minutes priors"
          git push origin fix/component-early-season-minutes-prior
