name: Materialise 2025/26 historical support

on:
  push:
    branches:
      - fix/live-faithful-early-season-validation
    paths:
      - "tools/apply_2025_holdout_support.py"
      - "tests/test_2025_holdout_support.py"
      - ".github/workflows/materialise-2025-holdout-support.yml"

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-faithful-early-season-validation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Apply 2025/26 support patch
        run: python tools/apply_2025_holdout_support.py
      - name: Verify source and tests
        run: |
          git diff --check -- src tests
          python -m unittest discover -s tests -v
      - name: Commit materialised support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backtest_fpl_model.py src/sync_historical_fpl.py
          git commit -m "Support 2025/26 historical defensive contributions"
          git push origin HEAD:fix/live-faithful-early-season-validation
