name: Apply FPL-22D reporting cleanup

on:
  push:
    branches:
      - feature/fpl-22d-policy-audit
    paths:
      - "tools/fpl22d_apply.py"
      - ".github/workflows/fpl22d-apply.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/fpl-22d-policy-audit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Apply deterministic FPL-22D transform
        run: python tools/fpl22d_apply.py

      - name: Compile changed modules
        run: >-
          python -m py_compile
          src/build_fpl_model.py
          src/external_context.py
          src/fpl_decisions.py
          src/fpl_gameweek_operations.py
          tests/test_fpl_22d_reporting.py

      - name: Run focused FPL-22D tests
        run: python -m unittest tests.test_fpl_22d_reporting -v

      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v

      - name: Build model outputs
        run: python -m src.build_fpl_model --data-dir data

      - name: Audit generated policy and captain outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("data/model/ensemble_production_policy.json").read_text(encoding="utf-8"))
          summary = json.loads(Path("data/chatgpt/projection_summary.json").read_text(encoding="utf-8"))
          decisions = json.loads(Path("data/chatgpt/fpl_decisions.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/chatgpt/gameweek_report.json").read_text(encoding="utf-8"))
          external = json.loads(Path("data/chatgpt/external_context_summary.json").read_text(encoding="utf-8"))

          production = summary.get("production_policy") or {}
          assert production.get("status") == policy.get("status")
          assert production.get("live_model_version") == policy.get("live_model_version")
          assert production.get("live_point_weight") == policy.get("live_point_weight")
          assert production.get("live_probability_weights") == policy.get("live_probability_weights")
          assert production.get("challenger_mode") == policy.get("challenger_mode")
          assert summary.get("model_version") == policy.get("live_model_version")
          assert "Development-selected ensemble" not in summary.get("method", "")
          assert "validated ensemble forecast" not in external.get("principle", "")

          scoring = (decisions.get("captaincy") or {}).get("scoring_basis") or {}
          assert scoring.get("reported_xpts") == "mean_expected_points_only"
          assert scoring.get("strategic_bonus_is_expected_points") is False
          audit = report.get("captaincy_audit") or {}
          assert audit.get("reported_xpts_basis") == "mean_expected_points_only"
          assert audit.get("strategic_bonus_is_expected_points") is False

          recommendation = report.get("recommendation") or {}
          route_plan = (report.get("six_gameweek_plan") or {}).get("gameweek_plan") or []
          target = report.get("target_gameweek")
          current_route = next((row for row in route_plan if row.get("gameweek") == target), {})
          route_captain = current_route.get("captain_player_id")
          report_captain = (recommendation.get("captain") or {}).get("player_id")
          if route_captain:
              assert report_captain == route_captain
          print("FPL_22D_AUDIT", json.dumps({
              "summary_model": summary.get("model_version"),
              "policy_status": production.get("status"),
              "challenger_mode": production.get("challenger_mode"),
              "captain": report_captain,
              "captain_audit": audit.get("captain"),
              "vice_audit": audit.get("vice_captain"),
          }, sort_keys=True))
          PY

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/build_fpl_model.py \
            src/external_context.py \
            src/fpl_decisions.py \
            src/fpl_gameweek_operations.py \
            tests/test_fpl_22d_reporting.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Make FPL reporting policy and captain audits explicit"
          git push origin HEAD:feature/fpl-22d-policy-audit
