name: Apply transfer robustness patch

on:
  push:
    branches:
      - fix/robust-transfer-action
    paths:
      - .github/workflows/apply-transfer-robustness-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/robust-transfer-action
      - name: Apply source and regression-test patch
        run: echo '' | base64 -d | python
      - name: Run focused regression tests
        run: python -m unittest tests.test_phase17_multiweek -v
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fpl_multiweek.py tests/test_phase17_multiweek.py
          git commit -m "Preserve robust transfer action under target ambiguity"
          git push origin HEAD:fix/robust-transfer-action
