name: Backtest FPL prediction model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 1 * *"
  push:
    branches:
      - main
    paths:
      - "src/backtest_fpl_model.py"
      - "src/player_return_simulator.py"
      - "src/build_fpl_model.py"
      - "tests/test_backtest_fpl_model.py"
      - ".github/workflows/backtest-fpl-model.yml"
      - "data/history/historical_player_gameweeks.csv.gz"

permissions:
  contents: write

concurrency:
  group: fpl-model-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run leakage-safe walk-forward backtest
        run: python -m src.backtest_fpl_model --data-dir data

      - name: Commit backtest evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtests data/model
          if git diff --cached --quiet; then
            echo "No backtest changes to commit"
          else
            git commit -m "Update FPL model backtest"
            git pull --rebase origin main
            git push
          fi
