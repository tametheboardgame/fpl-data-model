name: Sync external FPL context

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-external-context.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: fpl-external-context
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Sync injuries and confirmed line-ups
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY is not configured; leaving the provider dormant"
            exit 0
          fi
          python -m src.sync_api_football_context --data-dir data --max-requests 8
      - name: Validate external context
        run: python -m src.external_context validate --signals data/context/signals.jsonl --sources data/context/sources.json
      - name: Commit new context observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/context data/raw/external/api-football/latest || true
          if git diff --cached --quiet; then
            echo "No external-context changes to commit"
          else
            git commit -m "Update automated FPL context"
            git pull --rebase origin main
            git push
          fi
