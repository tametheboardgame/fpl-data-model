name: Sync external FPL context

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "src/sync_odds_api_context.py"
      - ".github/workflows/sync-external-context.yml"

permissions:
  contents: write

concurrency:
  group: fpl-external-context
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Sync injuries and confirmed line-ups
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY is not configured; leaving the provider dormant"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && grep -q '"status": "plan_blocked"' data/context/provider_status.json; then
            echo "API-Football current season is blocked by the active plan; scheduled retry skipped"
            exit 0
          fi
          python -m src.sync_api_football_context --data-dir data --max-requests 8
      - name: Sync bookmaker market probabilities
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY is not configured; leaving The Odds API dormant"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            python -m src.sync_odds_api_context --data-dir data --force-provider-check
          else
            python -m src.sync_odds_api_context --data-dir data
          fi
      - name: Validate external context
        if: always()
        run: python -m src.external_context validate --signals data/context/signals.jsonl --sources data/context/sources.json
      - name: Commit new context observations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/context
          if [ -d data/raw/external/api-football/latest ]; then
            git add data/raw/external/api-football/latest
          fi
          if [ -d data/raw/external/odds-api/latest ]; then
            git add data/raw/external/odds-api/latest
          fi
          if git diff --cached --quiet; then
            echo "No external-context changes to commit"
          else
            git commit -m "Update automated FPL context"
            git pull --rebase origin main
            git push
          fi
