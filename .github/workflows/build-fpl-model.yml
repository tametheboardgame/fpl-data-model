name: Build FPL prediction model

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update FPL data"
    types:
      - completed
  schedule:
    - cron: "50 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-fpl-model.yml"
      - "data/chatgpt/current_gameweek.json"
      - "data/scouting/**"
      - "data/context/**"
      - "data/chatgpt/players.csv"
      - "data/chatgpt/fixtures.csv"
      - "data/chatgpt/player_fixtures.csv"
      - "data/chatgpt/gameweeks.json"
      - "data/chatgpt/manager_history.json"
      - "data/history/current_player_past_seasons.csv"
      - "data/history/position_priors.csv"
      - "data/model/ensemble_model_candidate.json"
      - "data/model/component_model_candidate.json"
  pull_request:
    branches:
      - main
    paths:
      - "src/build_fpl_model.py"
      - "src/player_return_simulator.py"
      - "src/component_player_simulator.py"
      - "src/scouting_observations.py"
      - "src/external_context.py"
      - "src/fpl_decisions.py"
      - "src/fpl_initial_squad.py"
      - "src/fpl_launch_validation.py"
      - "src/fpl_multiweek.py"
      - "src/fpl_chip_optimizer.py"
      - "src/fpl_chips.py"
      - "src/fpl_rules.py"
      - "src/fpl_transfers.py"
      - "src/fpl_prospective.py"
      - "src/fpl_gameweek_operations.py"
      - "src/fpl_deadline_scheduler.py"
      - "src/evaluate_external_context.py"
      - "src/finalise_external_context.py"
      - "tests/test_phase18_chips.py"
      - "tests/test_wildcard_strategy.py"
      - "tests/test_wildcard_operations.py"
      - "tests/test_phase19_prospective.py"
      - "tests/test_phase20_initial_squad.py"
      - "tests/test_phase21_gameweek_operations.py"
      - "tests/test_phase21_1_launch_hardening.py"
      - "tests/test_phase21_2_operational_hardening.py"
      - "docs/phase19_prospective_evaluation.md"
      - "docs/phase20_initial_squad_readiness.md"
      - "docs/phase21_gameweek_operations.md"
      - "docs/phase21_1_launch_validation.md"
      - "docs/phase21_2_operational_hardening.md"
      - ".github/workflows/deadline-fpl-refresh.yml"
      - ".github/workflows/build-fpl-model.yml"
      - "data/scouting/**"
      - "data/context/**"
      - "data/chatgpt/players.csv"
      - "data/chatgpt/fixtures.csv"
      - "data/chatgpt/player_fixtures.csv"
      - "data/chatgpt/gameweeks.json"
      - "data/chatgpt/manager_history.json"
      - "data/history/current_player_past_seasons.csv"
      - "data/history/position_priors.csv"
      - "data/model/ensemble_model_candidate.json"
      - "data/model/component_model_candidate.json"
permissions:
  contents: write

concurrency:
  group: fpl-prediction-model-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate qualitative scouting observations
        run: python -m src.scouting_observations validate --path data/scouting/observations.jsonl
      - name: Validate external context
        run: python -m src.external_context validate --signals data/context/signals.jsonl --sources data/context/sources.json
      - name: Build rolling features and projections
        run: python -m src.build_fpl_model --data-dir data
      - name: Score context and attach chip state
        run: python -m src.finalise_external_context --data-dir data
      - name: Audit generated recommendation
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("data/chatgpt/gameweek_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          recommendation = report.get("recommendation") or {}
          chip = report.get("chip_recommendation") or {}
          audit = {
              "target_gameweek": report.get("target_gameweek"),
              "selection_source": recommendation.get("selection_source"),
              "transfer_action": recommendation.get("transfer_action"),
              "expected_points": recommendation.get("expected_points"),
              "captain": (recommendation.get("captain") or {}).get("web_name"),
              "vice_captain": (recommendation.get("vice_captain") or {}).get("web_name"),
              "starting_xi": [row.get("web_name") for row in recommendation.get("starting_xi", [])],
              "squad_player_ids": recommendation.get("squad_player_ids", []),
              "chip_action": chip.get("action"),
              "chip": chip.get("chip"),
              "chip_gameweek": chip.get("gameweek"),
              "chip_incremental_expected_points": chip.get("incremental_expected_points"),
              "wildcard_objective_version": chip.get("wildcard_objective_version"),
              "strategic_objective_edge": chip.get("strategic_objective_edge"),
              "strategic_audit": chip.get("strategic_audit"),
          }
          print("PR_MODEL_RECOMMENDATION_AUDIT")
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          PY
      - name: Commit model outputs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chatgpt
          if [ -d data/predictions ]; then
            git add data/predictions
          fi
          if [ -d data/prospective ]; then
            git add data/prospective
          fi
          if [ -d data/operations ]; then
            git add data/operations
          fi
          if git diff --cached --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "Update FPL model outputs"
            git pull --rebase origin main
            git push
          fi
