name: Build FPL prediction model

on:
  workflow_dispatch:
  schedule:
    - cron: "50 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "src/build_fpl_model.py"
      - ".github/workflows/build-fpl-model.yml"
      - "data/chatgpt/players.csv"
      - "data/chatgpt/fixtures.csv"
      - "data/chatgpt/player_fixtures.csv"
      - "data/history/current_player_past_seasons.csv"
      - "data/history/position_priors.csv"

permissions:
  contents: write

concurrency:
  group: fpl-prediction-model
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build rolling features and projections
        run: python -m src.build_fpl_model --data-dir data

      - name: Commit model outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chatgpt
          if [ -d data/predictions ]; then
            git add data/predictions
          fi
          if git diff --cached --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "Update FPL model outputs"
            git pull --rebase origin main
            git push
          fi
