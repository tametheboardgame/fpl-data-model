name: Materialise completed-history fix on latest main

on:
  push:
    branches:
      - fix/completed-history-on-sticky-policy

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/completed-history-on-sticky-policy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Apply completed-history filter
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/build_fpl_model.py')
          text = model.read_text(encoding='utf-8')

          anchor = '''\n\ndef build_player_features(\n    players: list[dict[str, Any]], fixture_history: list[dict[str, Any]]\n) -> list[dict[str, Any]]:\n'''
          addition = '''\n\ndef completed_fixture_history(\n    fixture_history: list[dict[str, Any]], fixtures: list[dict[str, Any]]\n) -> list[dict[str, Any]]:\n    \"\"\"Return only player-history rows whose official fixture is complete.\n\n    The live element-summary endpoint can expose a current-Gameweek history row\n    after the FPL deadline but before that player's match has finished. Treating\n    those zero/partial rows as completed appearances dilutes minutes, starts and\n    team-form rates. Production features therefore admit history only when the\n    matching fixture has `finished=true`.\n    \"\"\"\n\n    finished_fixture_ids = {\n        integer(row.get(\"fixture_id\"))\n        for row in fixtures\n        if truthy(row.get(\"finished\"))\n    }\n    return [\n        row\n        for row in fixture_history\n        if integer(row.get(\"fixture\")) in finished_fixture_ids\n    ]\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition + anchor, 1)

          old = '''    player_features = build_player_features(players, fixture_history)\n    team_features = build_team_features(teams, fixture_history, fixtures)\n'''
          new = '''    completed_history = completed_fixture_history(fixture_history, fixtures)\n    player_features = build_player_features(players, completed_history)\n    team_features = build_team_features(teams, completed_history, fixtures)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        \"player_feature_rows\": len(player_features),\n        \"team_feature_rows\": len(team_features),\n        \"fixture_projection_rows\": len(projections),\n'''
          new = '''        \"player_feature_rows\": len(player_features),\n        \"team_feature_rows\": len(team_features),\n        \"raw_fixture_history_rows\": len(fixture_history),\n        \"completed_fixture_history_rows\": len(completed_history),\n        \"fixture_projection_rows\": len(projections),\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          model.write_text(text, encoding='utf-8')

          tests = Path('tests/test_build_fpl_model.py')
          text = tests.read_text(encoding='utf-8')
          old = '''    build_model,\n    build_player_features,\n    build_projections,\n'''
          new = '''    build_model,\n    build_player_features,\n    completed_fixture_history,\n    build_projections,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          anchor = '''\n    def test_builds_rolling_features_and_projection(self) -> None:\n'''
          addition = '''\n    def test_unfinished_current_gameweek_history_is_excluded_from_live_features(self) -> None:\n        history = [\n            self.history[0],\n            self.history[1],\n            {\n                **self.history[2],\n                \"fixture\": 99,\n                \"round\": 3,\n                \"kickoff_time\": \"2026-01-10T15:00:00Z\",\n                \"minutes\": 0,\n                \"starts\": 0,\n                \"total_points\": 0,\n                \"expected_goals\": 0,\n                \"expected_assists\": 0,\n                \"expected_goal_involvements\": 0,\n            },\n        ]\n        fixtures = [\n            {\"fixture_id\": 1, \"finished\": True},\n            {\"fixture_id\": 2, \"finished\": True},\n            {\"fixture_id\": 99, \"finished\": False},\n        ]\n\n        completed = completed_fixture_history(history, fixtures)\n        player_features = build_player_features(self.players, completed)\n        team_features = build_team_features(self.teams, completed)\n\n        self.assertEqual([row[\"fixture\"] for row in completed], [1, 2])\n        self.assertEqual(player_features[0][\"history_fixture_count\"], 2)\n        self.assertEqual(player_features[0][\"appearance_rate_3\"], 1.0)\n        self.assertEqual(player_features[0][\"start_rate_3\"], 1.0)\n        self.assertEqual(player_features[0][\"average_minutes_3\"], 90.0)\n        self.assertEqual(team_features[0][\"matches_3\"], 2)\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit materialised source
        run: |
          rm .github/workflows/materialise-completed-history-rebase.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/build_fpl_model.py tests/test_build_fpl_model.py .github/workflows/materialise-completed-history-rebase.yml
          git commit -m 'Exclude unfinished fixtures from live history features'
          git push origin HEAD:fix/completed-history-on-sticky-policy
