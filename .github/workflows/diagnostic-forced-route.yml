name: Diagnostic forced-route replay (PR only)
on:
  pull_request:
    branches: [main]
    paths:
      - "src/diagnostic_*.py"
      - "tests/test_diagnostic_*.py"
      - ".github/workflows/diagnostic-forced-route.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_diagnostic_*.py" -v
      - name: Run exact-input control and forced-Groß diagnostic
        run: python -m src.diagnostic_exact_build > forced-route-audit.log 2>&1 || { cat forced-route-audit.log; exit 1; }
      - name: Show audit summary
        run: sed -n '/FORCED_ROUTE_DIAGNOSTIC_JSON_START/,/FORCED_ROUTE_DIAGNOSTIC_JSON_END/p' forced-route-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forced-route-diagnostic
          path: forced-route-audit.log
