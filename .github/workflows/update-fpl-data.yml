name: Update FPL data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "README.md"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fpl-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect live FPL data
        run: python -m src.update_fpl_data --team-id 39395 --output-dir data

      - name: Validate generated datasets
        run: python -m src.validate_fpl_data --data-dir data

      - name: Commit refreshed datasets
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update FPL datasets"
            git pull --rebase origin main
            git push
          fi
