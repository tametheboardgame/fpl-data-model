name: Materialise holdout rejection fallback

on:
  push:
    branches:
      - fix/control-production-after-holdout
    paths:
      - ".github/workflows/materialise-holdout-rejection-fallback.yml"

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/control-production-after-holdout
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Apply fallback patch
        run: python tools/apply_holdout_rejection_fallback.py
      - name: Verify fallback
        run: |
          git diff --check -- src tests
          python -m unittest discover -s tests -v
      - name: Commit materialised source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/build_fpl_model.py src/fpl_decisions.py tests/test_external_context_and_decisions.py
          git commit -m "Fallback to control after ensemble holdout rejection"
          git push origin HEAD:fix/control-production-after-holdout
