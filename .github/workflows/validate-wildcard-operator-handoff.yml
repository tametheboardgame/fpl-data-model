name: Validate Wildcard scoring-basis handoff

on:
  push:
    branches:
      - fix/wildcard-captain-archetype-search
    paths:
      - ".github/workflows/validate-wildcard-operator-handoff.yml"

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/wildcard-captain-archetype-search
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt

      - name: Apply scoring-basis handoff patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:180]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Persist the exact target-Gameweek mean basis used to score the selected
          # Wildcard. This keeps the operator report on the same decision-adjusted
          # xPts basis without leaking strategic bonuses into expected points.
          replace_once(
              "src/fpl_chip_optimizer.py",
              '''                        "starter_player_ids": wc_starters,\n                        "captain_player_id": wc_captain,\n                        "transfers_in_rebuild": transfers,''',
              '''                        "starter_player_ids": wc_starters,\n                        "captain_player_id": wc_captain,\n                        "gameweek_expected_points_by_player": {\n                            str(player_id): round(\n                                matrix.get(gameweek, {}).get(player_id, 0.0), 6\n                            )\n                            for player_id in wc_ids\n                        },\n                        "transfers_in_rebuild": transfers,''',
          )

          replace_once(
              "src/fpl_gameweek_operations.py",
              '''    wildcard_points = {\n        integer(row.get("player_id")): number(row.get("expected_points_next_1"))\n        for row in horizons\n        if integer(row.get("player_id"))\n    }\n    recommended_starter_ids = [''',
              '''    wildcard_points = {\n        integer(row.get("player_id")): number(row.get("expected_points_next_1"))\n        for row in horizons\n        if integer(row.get("player_id"))\n    }\n    recommendation_points = {\n        integer(player_id): number(value)\n        for player_id, value in (\n            recommendation.get("gameweek_expected_points_by_player") or {}\n        ).items()\n        if integer(player_id)\n    }\n    if replacement_ids and replacement_ids.issubset(recommendation_points):\n        wildcard_points.update(\n            {player_id: recommendation_points[player_id] for player_id in replacement_ids}\n        )\n        wildcard_points_source = "chip_optimisation_target_gameweek"\n    else:\n        wildcard_points_source = "horizon_fallback"\n    recommended_starter_ids = [''',
          )

          replace_once(
              "src/fpl_gameweek_operations.py",
              '''            "wildcard_lineup_source": wildcard_lineup_source,\n            "wildcard_objective_version": recommendation.get(''',
              '''            "wildcard_lineup_source": wildcard_lineup_source,\n            "wildcard_points_source": wildcard_points_source,\n            "wildcard_objective_version": recommendation.get(''',
          )

          # Synthetic operator test: make the recommendation scoring basis visibly
          # different from the raw horizon values and assert that the report uses it.
          replace_once(
              "tests/test_wildcard_operations.py",
              '''                    "captain_player_id": 8,\n                    "transfers_in_rebuild": 4,''',
              '''                    "captain_player_id": 8,\n                    "gameweek_expected_points_by_player": {\n                        str(player_id): (\n                            7.0 if player_id == 8 else 2.0\n                        )\n                        for player_id in self.wildcard_squad\n                    },\n                    "transfers_in_rebuild": 4,''',
          )

          anchor = '''    def test_wildcard_lineup_falls_back_when_optimiser_metadata_is_missing(self) -> None:\n'''
          target = Path("tests/test_wildcard_operations.py")
          text = target.read_text(encoding="utf-8")
          tests = '''    def test_wildcard_report_uses_optimiser_gameweek_mean_basis(self) -> None:\n        report = self.build()\n        selection = report["recommendation"]\n        starter_points = {\n            row["player_id"]: row["expected_points"]\n            for row in selection["starting_xi"]\n        }\n\n        self.assertEqual(selection["wildcard_points_source"], "chip_optimisation_target_gameweek")\n        self.assertEqual(starter_points[8], 7.0)\n        # Ten other starters at 2.0, captain 8 at 7.0, then captain doubled.\n        self.assertEqual(selection["expected_points"], 34.0)\n        self.assertEqual(selection["net_expected_points"], 34.0)\n\n    def test_wildcard_report_falls_back_to_horizon_points_without_scoring_map(self) -> None:\n        self.decision["chip_optimisation"]["recommendation"].pop(\n            "gameweek_expected_points_by_player"\n        )\n\n        report = self.build()\n\n        self.assertEqual(\n            report["recommendation"]["wildcard_points_source"],\n            "horizon_fallback",\n        )\n\n'''
          if anchor not in text:
              raise SystemExit("Wildcard scoring-basis test anchor missing")
          target.write_text(text.replace(anchor, tests + anchor, 1), encoding="utf-8")

          # Direct optimiser regression: prove the candidate carries the same
          # first-GW multiplier that was used to make the Wildcard decision.
          target = Path("tests/test_phase18_chips.py")
          text = target.read_text(encoding="utf-8")
          anchor = '''    def test_used_chip_is_not_considered(self) -> None:\n'''
          test = '''    def test_wildcard_candidate_exports_target_gameweek_mean_basis(self) -> None:\n        result = optimise_chip_plan(\n            self.projections(),\n            self.players,\n            self.squad,\n            25.0,\n            self.chips,\n            self.route,\n            10,\n            first_gameweek_multiplier={1: 1.5},\n        )\n        wildcard = result["best_by_chip"]["wildcard"]\n        self.assertAlmostEqual(\n            wildcard["gameweek_expected_points_by_player"]["1"],\n            4.5,\n        )\n        self.assertAlmostEqual(\n            wildcard["gameweek_expected_points_by_player"]["2"],\n            3.0,\n        )\n\n'''
          if anchor not in text:
              raise SystemExit("Phase 18 scoring-basis test anchor missing")
          target.write_text(text.replace(anchor, test + anchor, 1), encoding="utf-8")
          PY

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Build live integration shadow
        run: python -m src.build_fpl_model --data-dir data

      - name: Verify scoring-basis consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(Path("data/chatgpt/fpl_decisions.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/chatgpt/gameweek_report.json").read_text(encoding="utf-8"))
          chip = (decision.get("chip_optimisation") or {}).get("recommendation") or {}
          selection = report.get("recommendation") or {}
          if chip.get("action") == "play" and chip.get("chip") == "wildcard":
              audit = chip.get("strategic_audit") or []
              target_mean = float((audit[0] if audit else {}).get("mean_expected_points") or 0)
              reported_mean = float(selection.get("expected_points") or 0)
              if abs(target_mean - reported_mean) > 0.002:
                  raise SystemExit(
                      f"Wildcard xPts basis mismatch: {target_mean=} {reported_mean=}"
                  )
              if selection.get("wildcard_points_source") != "chip_optimisation_target_gameweek":
                  raise SystemExit("Operator did not use optimiser target-GW mean basis")
          print(json.dumps({
              "captain": (selection.get("captain") or {}).get("web_name"),
              "vice_captain": (selection.get("vice_captain") or {}).get("web_name"),
              "reported_expected_points": selection.get("expected_points"),
              "strategic_audit_mean": ((chip.get("strategic_audit") or [{}])[0]).get("mean_expected_points"),
              "wildcard_points_source": selection.get("wildcard_points_source"),
          }, indent=2, ensure_ascii=False))
          PY

      - name: Commit validated source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fpl_chip_optimizer.py src/fpl_gameweek_operations.py tests/test_wildcard_operations.py tests/test_phase18_chips.py
          git diff --cached --check
          git commit -m "Keep Wildcard report on optimiser xPts basis"
          git push origin fix/wildcard-captain-archetype-search
