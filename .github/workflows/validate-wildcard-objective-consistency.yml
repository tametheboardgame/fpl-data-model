name: Validate Wildcard objective consistency

on:
  push:
    branches:
      - fix/wildcard-captain-archetype-search
    paths:
      - ".github/workflows/validate-wildcard-objective-consistency.yml"

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/wildcard-captain-archetype-search
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt

      - name: Apply objective consistency patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/fpl_chip_optimizer.py",
              'WILDCARD_OBJECTIVE_VERSION = "captaincy-ceiling-1.3"',
              'WILDCARD_OBJECTIVE_VERSION = "captaincy-ceiling-1.4"',
          )

          # Tail quantile and mean must move together when the target-GW decision
          # layer scales a player's expectation. Probabilities remain raw until we
          # have prospective evidence for distribution re-calibration.
          replace_once(
              "src/fpl_chip_optimizer.py",
              '''def _fixture_metric_matrix(\n    fixture_projections: list[dict[str, Any]],\n    gameweeks: list[int],\n    fields: tuple[str, ...],\n) -> dict[int, dict[int, float]]:''',
              '''def _fixture_metric_matrix(\n    fixture_projections: list[dict[str, Any]],\n    gameweeks: list[int],\n    fields: tuple[str, ...],\n    first_gameweek_multiplier: dict[int, float] | None = None,\n) -> dict[int, dict[int, float]]:''',
          )
          replace_once(
              "src/fpl_chip_optimizer.py",
              '''        result.setdefault(gameweek, {})[player_id] = (\n            result.setdefault(gameweek, {}).get(player_id, 0.0) + value\n        )''',
              '''        if gameweeks and gameweek == gameweeks[0]:\n            value *= number((first_gameweek_multiplier or {}).get(player_id, 1.0))\n        result.setdefault(gameweek, {})[player_id] = (\n            result.setdefault(gameweek, {}).get(player_id, 0.0) + value\n        )''',
          )
          replace_once(
              "src/fpl_chip_optimizer.py",
              '''    p90_matrix = _fixture_metric_matrix(\n        fixture_projections,\n        gameweeks,\n        ("points_p90", "component_points_p90"),\n    )''',
              '''    p90_matrix = _fixture_metric_matrix(\n        fixture_projections,\n        gameweeks,\n        ("points_p90", "component_points_p90"),\n        first_gameweek_multiplier,\n    )''',
          )

          # Strategic captaincy is attacker-first when a defender's utility edge is
          # within the same 1.5-point uncertainty band already used for route
          # separation. A genuinely exceptional defensive captain can still win.
          anchor = '''def _missing_elite_attacking_captain_seed(\n'''
          target = Path("src/fpl_chip_optimizer.py")
          text = target.read_text(encoding="utf-8")
          helper = '''def _select_strategic_captain(\n    starter_ids: list[int] | tuple[int, ...] | set[int],\n    player_by_id: dict[int, dict[str, Any]],\n    expected_points: dict[int, float],\n    p90: dict[int, float],\n    probability_10_plus: dict[int, float],\n    probability_15_plus: dict[int, float],\n) -> int | None:\n    starters = tuple(starter_ids)\n    if not starters:\n        return None\n    overall = max(\n        starters,\n        key=lambda player_id: _captain_utility(\n            player_id, player_by_id, expected_points, p90,\n            probability_10_plus, probability_15_plus\n        )[0],\n    )\n    if str(player_by_id.get(overall, {}).get("position")) not in {"Goalkeeper", "Defender"}:\n        return overall\n    attacker, attacker_utility = _best_attacking_captain_utility(\n        starters, player_by_id, expected_points, p90,\n        probability_10_plus, probability_15_plus\n    )\n    if attacker is None:\n        return overall\n    overall_utility = _captain_utility(\n        overall, player_by_id, expected_points, p90,\n        probability_10_plus, probability_15_plus\n    )[0]\n    if overall_utility - attacker_utility <= MINIMUM_ROUTE_SEPARATION_POINTS + 1e-9:\n        return attacker\n    return overall\n\n\n'''
          if anchor not in text:
              raise SystemExit("captain helper anchor missing")
          target.write_text(text.replace(anchor, helper + anchor, 1), encoding="utf-8")

          replace_once(
              "src/fpl_chip_optimizer.py",
              '''    captain = max(\n        starter_set,\n        key=lambda player_id: _captain_utility(\n            player_id,\n            player_by_id,\n            expected_points,\n            p90,\n            probability_10_plus,\n            probability_15_plus,\n        )[0],\n        default=None,\n    )''',
              '''    captain = _select_strategic_captain(\n        starter_set,\n        player_by_id,\n        expected_points,\n        p90,\n        probability_10_plus,\n        probability_15_plus,\n    )''',
          )

          replace_once(
              "src/fpl_chip_optimizer.py",
              '''            "first_gameweek_multiplier_applied": bool(first_gameweek_multiplier),\n            "adjusted_player_count": sum(''',
              '''            "first_gameweek_multiplier_applied": bool(first_gameweek_multiplier),\n            "target_gameweek_p90_multiplier_applied": bool(first_gameweek_multiplier),\n            "raw_tail_probabilities_retained": True,\n            "adjusted_player_count": sum(''',
          )
          replace_once(
              "src/fpl_chip_optimizer.py",
              '''                "The target-Gameweek mean follows the same decision-layer market and "\n                "selection-risk adjustment as the transfer optimiser; raw tail "\n                "probabilities remain unchanged."''',
              '''                "The target-Gameweek mean and p90 quantile follow the same decision-layer "\n                "multiplier; raw 10+/15+ probabilities remain unchanged pending prospective "\n                "distribution-calibration evidence."''',
          )
          replace_once(
              "src/fpl_chip_optimizer.py",
              '''            "archetype_separation_points": MINIMUM_ROUTE_SEPARATION_POINTS,\n            "target_gameweek_missing_elite_captain_seed_count": 1,''',
              '''            "archetype_separation_points": MINIMUM_ROUTE_SEPARATION_POINTS,\n            "defensive_captain_exception_separation_points": MINIMUM_ROUTE_SEPARATION_POINTS,\n            "target_gameweek_missing_elite_captain_seed_count": 1,''',
          )

          target = Path("tests/test_wildcard_strategy.py")
          text = target.read_text(encoding="utf-8")
          text = text.replace(
              '''    _captain_utility,\n    _ownership_pressure,''',
              '''    _captain_utility,\n    _fixture_metric_matrix,\n    _ownership_pressure,\n    _select_strategic_captain,''',
              1,
          )
          anchor = '''    def test_objective_version_records_beam_search_fix(self) -> None:\n'''
          tests = '''    def test_target_gameweek_p90_scales_with_decision_mean(self) -> None:\n        rows = [\n            {"player_id": 1, "gameweek": 3, "points_p90": 10.0},\n            {"player_id": 1, "gameweek": 4, "points_p90": 9.0},\n        ]\n        matrix = _fixture_metric_matrix(\n            rows, [3, 4], ("points_p90",), {1: 1.2}\n        )\n\n        self.assertAlmostEqual(matrix[3][1], 12.0)\n        self.assertAlmostEqual(matrix[4][1], 9.0)\n\n    def test_strategic_captain_prefers_attacker_inside_uncertainty_band(self) -> None:\n        players = {\n            1: player(1, "Defender", ownership=75.0),\n            2: player(2, "Forward", ownership=50.0),\n        }\n        expected = {1: 6.0, 2: 5.8}\n        p90 = {1: 8.0, 2: 10.0}\n        p10 = {1: 0.10, 2: 0.20}\n        p15 = {1: 0.0, 2: 0.04}\n\n        defender_utility = _captain_utility(1, players, expected, p90, p10, p15)[0]\n        attacker_utility = _captain_utility(2, players, expected, p90, p10, p15)[0]\n        self.assertGreater(defender_utility, attacker_utility)\n        self.assertLessEqual(defender_utility - attacker_utility, 1.5)\n        self.assertEqual(\n            _select_strategic_captain({1, 2}, players, expected, p90, p10, p15),\n            2,\n        )\n\n    def test_exceptional_defender_can_still_be_strategic_captain(self) -> None:\n        players = {\n            1: player(1, "Defender", ownership=75.0),\n            2: player(2, "Forward", ownership=5.0),\n        }\n        expected = {1: 9.0, 2: 5.0}\n        p90 = {1: 14.0, 2: 8.0}\n        p10 = {1: 0.40, 2: 0.08}\n        p15 = {1: 0.10, 2: 0.01}\n\n        defender_utility = _captain_utility(1, players, expected, p90, p10, p15)[0]\n        attacker_utility = _captain_utility(2, players, expected, p90, p10, p15)[0]\n        self.assertGreater(defender_utility - attacker_utility, 1.5)\n        self.assertEqual(\n            _select_strategic_captain({1, 2}, players, expected, p90, p10, p15),\n            1,\n        )\n\n'''
          if anchor not in text:
              raise SystemExit("test anchor missing")
          text = text.replace(anchor, tests + anchor, 1)
          text = text.replace(
              'self.assertEqual(WILDCARD_OBJECTIVE_VERSION, "captaincy-ceiling-1.3")',
              'self.assertEqual(WILDCARD_OBJECTIVE_VERSION, "captaincy-ceiling-1.4")',
              1,
          )
          target.write_text(text, encoding="utf-8")
          PY

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Build live shadow model
        run: python -m src.build_fpl_model --data-dir data

      - name: Print target Wildcard consistency audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path("data/chatgpt/fpl_decisions.json").read_text(encoding="utf-8"))
          target = int(decision.get("target_gameweek") or 0)
          opt = decision.get("chip_optimisation", {})
          candidates = [row for row in opt.get("candidates", []) if row.get("chip") == "wildcard" and int(row.get("gameweek") or 0) == target]
          best = max(candidates, key=lambda row: row.get("strategic_objective_score", 0), default={})
          print("TARGET_WILDCARD", json.dumps({
              "target_gameweek": target,
              "status": best.get("status"),
              "mean_edge": best.get("incremental_expected_points"),
              "strategic_edge": best.get("strategic_objective_edge"),
              "strategic_score": best.get("strategic_objective_score"),
              "captain_player_id": best.get("captain_player_id"),
              "replacement_squad_player_ids": best.get("replacement_squad_player_ids"),
              "wildcard_search_audit": best.get("wildcard_search_audit"),
              "context_wiring": opt.get("context_wiring"),
          }, indent=2, ensure_ascii=False))
          PY

      - name: Commit validated source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fpl_chip_optimizer.py tests/test_wildcard_strategy.py
          git diff --cached --check
          git commit -m "Keep Wildcard captain objective internally consistent"
          git push origin fix/wildcard-captain-archetype-search
