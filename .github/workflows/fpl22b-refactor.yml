        )

    def test_weekly_decision_score_is_the_shared_utility(self) -> None:
        player = {
            "player_id": 9,
            "position": "Forward",
            "selected_by_percent": 75.0,
            "status": "a",
            "starts": 3,
            "minutes": 270,
        }
        horizon = {
