name: Apply FPL-22B shared captain utility

on:
  push:
    branches:
      - feature/fpl-22b-shared-captain-utility
    paths:
      - ".github/workflows/fpl22b-refactor.yml"
      - "tools/fpl22b_refactor.py"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/fpl-22b-shared-captain-utility
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Apply FPL-22B refactor
        run: python tools/fpl22b_refactor.py

      - name: Compile changed Python
        run: python -m compileall -q src tests

      - name: Run focused captain tests
        run: python -m unittest -v tests.test_fpl_captaincy tests.test_wildcard_strategy tests.test_phase18_chips tests.test_phase17_multiweek

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Commit validated source refactor
        shell: bash
        run: |
          git restore .github/workflows/build-fpl-model.yml
          rm tools/fpl22b_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fpl_captaincy.py src/fpl_decisions.py src/fpl_chip_optimizer.py tests/test_fpl_captaincy.py tests/test_phase18_chips.py docs/notes/shared-captain-utility.md docs/notes/captaincy-aware-wildcard.md tools/fpl22b_refactor.py
          git diff --cached --check
          git commit -m "Implement FPL-22B shared captain utility"
          git push origin HEAD:feature/fpl-22b-shared-captain-utility
