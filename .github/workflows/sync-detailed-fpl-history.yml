name: Sync detailed FPL history

on:
  workflow_dispatch:
  schedule:
    - cron: "42 3 * * *"
  push:
    branches:
      - main
    paths:
      - "src/sync_detailed_history.py"
      - ".github/workflows/sync-detailed-fpl-history.yml"

permissions:
  contents: write

concurrency:
  group: detailed-fpl-history
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Synchronise fixture-level history
        run: python -m src.sync_detailed_history --output-dir data --max-workers 8

      - name: Commit detailed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No detailed history changes to commit"
          else
            git commit -m "Update detailed FPL history"
            git pull --rebase origin main
            git push
          fi
