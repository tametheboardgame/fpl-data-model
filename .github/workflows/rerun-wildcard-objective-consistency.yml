name: Rerun Wildcard objective consistency

on:
  push:
    branches:
      - fix/wildcard-captain-archetype-search
    paths:
      - ".github/workflows/rerun-wildcard-objective-consistency.yml"

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/wildcard-captain-archetype-search
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt

      - name: Apply consistency patch with corrected synthetic fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/validate-wildcard-objective-consistency.yml').read_text(encoding='utf-8')
          start = workflow.index('          from pathlib import Path\n')
          end = workflow.index('\n          PY\n\n      - name: Run full unit suite', start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              'p90 = {1: 8.0, 2: 10.0}\\n        p10 = {1: 0.10, 2: 0.20}\\n        p15 = {1: 0.0, 2: 0.04}',
              'p90 = {1: 8.0, 2: 8.5}\\n        p10 = {1: 0.10, 2: 0.10}\\n        p15 = {1: 0.0, 2: 0.01}',
          )
          exec(compile(script, '<objective-consistency-patch>', 'exec'))
          PY

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Build live shadow model
        run: python -m src.build_fpl_model --data-dir data

      - name: Print target Wildcard consistency audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path('data/chatgpt/fpl_decisions.json').read_text(encoding='utf-8'))
          target = int(decision.get('target_gameweek') or 0)
          opt = decision.get('chip_optimisation', {})
          candidates = [
              row for row in opt.get('candidates', [])
              if row.get('chip') == 'wildcard' and int(row.get('gameweek') or 0) == target
          ]
          best = max(candidates, key=lambda row: row.get('strategic_objective_score', 0), default={})
          print('TARGET_WILDCARD', json.dumps({
              'target_gameweek': target,
              'status': best.get('status'),
              'mean_edge': best.get('incremental_expected_points'),
              'strategic_edge': best.get('strategic_objective_edge'),
              'strategic_score': best.get('strategic_objective_score'),
              'captain_player_id': best.get('captain_player_id'),
              'replacement_squad_player_ids': best.get('replacement_squad_player_ids'),
              'wildcard_search_audit': best.get('wildcard_search_audit'),
              'context_wiring': opt.get('context_wiring'),
          }, indent=2, ensure_ascii=False))
          PY

      - name: Commit validated source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fpl_chip_optimizer.py tests/test_wildcard_strategy.py
          git diff --cached --check
          git commit -m "Keep Wildcard captain objective internally consistent"
          git push origin fix/wildcard-captain-archetype-search
