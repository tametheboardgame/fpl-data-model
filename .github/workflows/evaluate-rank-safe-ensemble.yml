name: Evaluate rank-safe ensemble

on:
  push:
    branches:
      - fix/live-faithful-early-season-validation
    paths:
      - ".github/workflows/evaluate-rank-safe-ensemble.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-faithful-early-season-validation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify source
        run: |
          git diff --check
          python -m unittest discover -s tests -v
      - name: Download development and internal-validation seasons only
        run: |
          rm -rf /tmp/fpl-rank-safe
          python -m src.sync_historical_fpl \
            --output-dir /tmp/fpl-rank-safe \
            --seasons 2021-22 2022-23 2023-24 2024-25
      - name: Evaluate rank-safe architecture
        run: |
          PYTHONPATH=. python tools/evaluate_rank_safe_ensemble.py \
            --data-dir /tmp/fpl-rank-safe \
            --output /tmp/rank_safe_ensemble.json
      - name: Preserve evaluation
        uses: actions/upload-artifact@v4
        with:
          name: rank-safe-ensemble-development-evaluation
          path: /tmp/rank_safe_ensemble.json
          if-no-files-found: error
          retention-days: 90
